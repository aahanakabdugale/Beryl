<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="28" fill="url(#bg)"/>

  <!-- Desk Mouse Pad Reflection -->
  <ellipse cx="200" cy="275" rx="110" ry="25" fill="#CBD5E1" opacity="0.6"/>

  <!-- Mouse Contour -->
  <g filter="url(#shadow)">
    <!-- Main Ergonomic Palm Shell -->
    <path d="M 155 100 C 120 150, 115 240, 155 290 C 185 315, 215 315, 245 290 C 285 240, 280 150, 245 100 C 220 70, 180 70, 155 100 Z" 
          fill="url(#mouseBody)" stroke="#475569" stroke-width="2"/>

    <!-- Left / Right Click Split Line -->
    <line x1="200" y1="85" x2="200" y2="175" stroke="#0F172A" stroke-width="2.5"/>

    <!-- Rubber Grip Texture Lines Left -->
    <path d="M 125 180 Q 120 210 130 240" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
    <path d="M 132 185 Q 127 210 137 235" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>

    <!-- Rubber Grip Texture Lines Right -->
    <path d="M 275 180 Q 280 210 270 240" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
    <path d="M 268 185 Q 273 210 263 235" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>

    <!-- Side Thumb Forward/Back Buttons (Logitech M510 Feature) -->
    <rect x="117" y="160" width="8" height="22" rx="4" fill="#64748B"/>
    <rect x="119" y="190" width="8" height="22" rx="4" fill="#64748B"/>

    <!-- Scroll Wheel Housing -->
    <rect x="188" y="105" width="24" height="50" rx="10" fill="#0F172A"/>
    <!-- Textured Scroll Wheel -->
    <rect x="192" y="110" width="16" height="40" rx="8" fill="#475569" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="192" y1="120" x2="208" y2="120" stroke="#0F172A" stroke-width="2"/>
    <line x1="192" y1="130" x2="208" y2="130" stroke="#0F172A" stroke-width="2"/>
    <line x1="192" y1="140" x2="208" y2="140" stroke="#0F172A" stroke-width="2"/>

    <!-- Subtle Logitech Logo / Arc -->
    <circle cx="200" cy="235" r="16" fill="none" stroke="#64748B" stroke-width="2"/>
    <circle cx="205" cy="235" r="7" fill="#64748B"/>
  </g>

  <!-- Badge -->
  <rect x="100" y="340" width="200" height="28" rx="14" fill="#1E293B"/>
  <text x="200" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    LOGITECH M510 WIRELESS
  </text>
</svg>
