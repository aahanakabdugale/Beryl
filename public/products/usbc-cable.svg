<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <pattern id="braid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 8 L 8 0 M 0 0 L 8 8" stroke="#334155" stroke-width="1.2"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="28" fill="url(#bg)"/>

  <!-- Braided Cable Coil in Background -->
  <g filter="url(#shadow)">
    <!-- Outer Loop -->
    <circle cx="200" cy="180" r="100" fill="none" stroke="#1E293B" stroke-width="14"/>
    <circle cx="200" cy="180" r="100" fill="none" stroke="url(#braid)" stroke-width="12"/>

    <!-- Middle Loop -->
    <circle cx="200" cy="180" r="75" fill="none" stroke="#1E293B" stroke-width="14"/>
    <circle cx="200" cy="180" r="75" fill="none" stroke="url(#braid)" stroke-width="12"/>
  </g>

  <!-- Left USB-C Connector Head -->
  <g transform="translate(100, 150) rotate(-40)" filter="url(#shadow)">
    <!-- Cable relief -->
    <rect x="-8" y="55" width="16" height="30" rx="4" fill="#334155"/>
    <line x1="-8" y1="65" x2="8" y2="65" stroke="#1E293B" stroke-width="2"/>
    <line x1="-8" y1="75" x2="8" y2="75" stroke="#1E293B" stroke-width="2"/>
    <!-- Shell -->
    <rect x="-14" y="0" width="28" height="55" rx="7" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <rect x="-10" y="8" width="20" height="8" rx="2" fill="#0B7A5A"/>
    <!-- USB-C Plug Tip -->
    <rect x="-11" y="-22" width="22" height="22" rx="6" fill="url(#metal)"/>
    <rect x="-8" y="-18" width="16" height="4" rx="2" fill="#0F172A"/>
  </g>

  <!-- Right USB-C Connector Head -->
  <g transform="translate(285, 175) rotate(45)" filter="url(#shadow)">
    <!-- Cable relief -->
    <rect x="-8" y="55" width="16" height="30" rx="4" fill="#334155"/>
    <line x1="-8" y1="65" x2="8" y2="65" stroke="#1E293B" stroke-width="2"/>
    <line x1="-8" y1="75" x2="8" y2="75" stroke="#1E293B" stroke-width="2"/>
    <!-- Shell -->
    <rect x="-14" y="0" width="28" height="55" rx="7" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <rect x="-10" y="8" width="20" height="8" rx="2" fill="#0B7A5A"/>
    <!-- USB-C Plug Tip -->
    <rect x="-11" y="-22" width="22" height="22" rx="6" fill="url(#metal)"/>
    <rect x="-8" y="-18" width="16" height="4" rx="2" fill="#0F172A"/>
  </g>

  <!-- Badge -->
  <rect x="105" y="335" width="190" height="28" rx="14" fill="#0B7A5A"/>
  <text x="200" y="353" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    ANKER USB-C (6FT / 60W)
  </text>
</svg>
