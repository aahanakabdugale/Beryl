<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="chargerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="28" fill="url(#bg)"/>

  <!-- Wall Prongs (US type) peeking in background -->
  <g fill="#94A3B8">
    <rect x="160" y="60" width="16" height="40" rx="3"/>
    <rect x="224" y="60" width="16" height="40" rx="3"/>
    <circle cx="168" cy="74" r="3.5" fill="#475569"/>
    <circle cx="232" cy="74" r="3.5" fill="#475569"/>
  </g>

  <!-- Charger Main Body -->
  <g filter="url(#shadow)">
    <rect x="115" y="85" width="170" height="200" rx="28" fill="url(#chargerBody)" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Beveled Front Face -->
    <rect x="130" y="100" width="140" height="170" rx="20" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Green Power LED -->
    <circle cx="200" cy="125" r="4" fill="#10B981"/>

    <!-- Port 1: USB-C (20W PD) -->
    <g transform="translate(160, 150)">
      <rect x="0" y="0" width="80" height="24" rx="12" fill="#0F172A"/>
      <rect x="16" y="9" width="48" height="6" rx="3" fill="#E2E8F0"/>
      <text x="40" y="-6" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">USB-C PD 20W</text>
    </g>

    <!-- Port 2: USB-A (Quick Charge) -->
    <g transform="translate(155, 215)">
      <rect x="0" y="0" width="90" height="28" rx="6" fill="#0F172A"/>
      <rect x="12" y="8" width="66" height="8" rx="2" fill="#E2E8F0"/>
      <rect x="20" y="8" width="50" height="4" fill="#3B82F6"/>
      <text x="45" y="-6" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">USB-A QC 3.0</text>
    </g>
  </g>

  <!-- Fast Charge Bolt Icon -->
  <path d="M 197 295 L 205 295 L 201 303 L 207 303 L 195 315 L 199 307 L 193 307 Z" fill="#0B7A5A"/>

  <!-- Badge -->
  <rect x="105" y="335" width="190" height="28" rx="14" fill="#0F172A"/>
  <text x="200" y="353" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    20W DUAL FAST CHARGER
  </text>
</svg>
