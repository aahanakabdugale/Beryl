<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="armMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="28" fill="url(#bg)"/>

  <!-- Desk Edge Line -->
  <line x1="40" y1="315" x2="360" y2="315" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <!-- Heavy Duty Desk Clamp Base -->
    <rect x="70" y="270" width="45" height="45" rx="6" fill="url(#armMetal)"/>
    <rect x="75" y="315" width="35" height="20" rx="3" fill="#475569"/>
    <!-- Clamp Tightening Knob -->
    <circle cx="92" cy="342" r="8" fill="#1E293B"/>

    <!-- Lower Articulated Arm Pole -->
    <rect x="85" y="210" width="15" height="65" rx="4" fill="url(#armMetal)"/>
    <!-- Lower Swivel Joint -->
    <circle cx="92" cy="210" r="12" fill="#475569"/>
    <circle cx="92" cy="210" r="6" fill="#94A3B8"/>

    <!-- Gas Spring Upper Arm (Angled diagonally up right) -->
    <path d="M 92 210 L 210 135 L 222 148 L 104 223 Z" fill="url(#armMetal)"/>
    <!-- Gas Spring Cylinder (Silver detail) -->
    <line x1="115" y1="205" x2="195" y2="150" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>

    <!-- Elbow Joint -->
    <circle cx="216" cy="142" r="14" fill="#475569"/>
    <circle cx="216" cy="142" r="7" fill="#94A3B8"/>

    <!-- Forearm Extender (Angling down to monitor) -->
    <path d="M 216 142 L 265 175 L 260 185 L 210 152 Z" fill="url(#armMetal)"/>

    <!-- VESA Tilt / Swivel Mount Head -->
    <rect x="260" y="155" width="16" height="36" rx="4" fill="#0F172A"/>

    <!-- Mounted Monitor (Floating Screen) -->
    <g transform="translate(275, 80)">
      <!-- Bezel -->
      <rect x="0" y="0" width="90" height="150" rx="8" fill="#0F172A" stroke="#334155" stroke-width="2"/>
      <!-- Screen Display -->
      <rect x="4" y="4" width="82" height="142" rx="5" fill="#1E293B"/>
      <!-- Screen Glow / Code lines -->
      <rect x="12" y="20" width="40" height="4" rx="2" fill="#0B7A5A"/>
      <rect x="12" y="32" width="60" height="3" rx="1.5" fill="#64748B"/>
      <rect x="12" y="42" width="50" height="3" rx="1.5" fill="#64748B"/>
      <rect x="12" y="52" width="55" height="3" rx="1.5" fill="#3B82F6"/>
      <rect x="12" y="62" width="45" height="3" rx="1.5" fill="#64748B"/>
      <rect x="12" y="72" width="58" height="3" rx="1.5" fill="#64748B"/>
    </g>
  </g>

  <!-- Badge -->
  <rect x="90" y="340" width="220" height="28" rx="14" fill="#0F172A"/>
  <text x="200" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    HUANUO GAS SPRING ARM
  </text>
</svg>
