<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="hubAlum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="28" fill="url(#bg)"/>

  <!-- Braided Cord from Hub -->
  <path d="M 200 90 Q 200 60 260 60 L 300 60" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <!-- USB-C Plug Head -->
  <rect x="290" y="52" width="25" height="16" rx="4" fill="#0F172A"/>
  <rect x="315" y="55" width="15" height="10" rx="3" fill="#94A3B8"/>

  <!-- Hub Main Bar -->
  <g filter="url(#shadow)">
    <rect x="135" y="85" width="130" height="235" rx="20" fill="url(#hubAlum)" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Power LED -->
    <circle cx="200" cy="110" r="3.5" fill="#10B981"/>

    <!-- Port 1: HDMI 4K -->
    <rect x="165" y="125" width="70" height="16" rx="3" fill="#0F172A"/>
    <text x="200" y="122" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">HDMI 4K</text>

    <!-- Port 2: USB-C PD 100W -->
    <rect x="175" y="155" width="50" height="12" rx="6" fill="#0F172A"/>
    <rect x="188" y="159" width="24" height="4" rx="2" fill="#E2E8F0"/>
    <text x="200" y="152" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">100W PD</text>

    <!-- Port 3: USB 3.0 (Blue) -->
    <rect x="165" y="180" width="70" height="14" rx="3" fill="#0F172A"/>
    <rect x="172" y="184" width="56" height="4" fill="#2563EB"/>
    <text x="200" y="177" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">USB 3.0 (5Gbps)</text>

    <!-- Port 4: USB 3.0 (Blue) -->
    <rect x="165" y="215" width="70" height="14" rx="3" fill="#0F172A"/>
    <rect x="172" y="219" width="56" height="4" fill="#2563EB"/>

    <!-- Port 5 & 6: SD / MicroSD Slots -->
    <rect x="160" y="250" width="80" height="6" rx="2" fill="#0F172A"/>
    <rect x="175" y="265" width="50" height="5" rx="2" fill="#0F172A"/>
    <text x="200" y="246" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">SD / TF CARD</text>

    <!-- Brand Label -->
    <text x="200" y="298" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#475569" text-anchor="middle" letter-spacing="1.5">ANKER</text>
  </g>

  <!-- Badge -->
  <rect x="100" y="340" width="200" height="28" rx="14" fill="#0B7A5A"/>
  <text x="200" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    ANKER 7-IN-1 USB-C HUB
  </text>
</svg>
